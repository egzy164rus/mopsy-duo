<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF6EC" />
    <meta name="description" content="Мопсик вдвоём — добрый тамагочи для двоих: кормите, гуляйте и играйте с общим мопсом вместе." />
    <title>Мопсик вдвоём 🐶</title>

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%B6%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/pug.css" />

    <!-- Telegram Mini App SDK. В браузере просто не загрузится — играем в вебе. -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  </head>
  <body>
    <div class="bg-decor" aria-hidden="true">
      <span class="blob blob-1"></span>
      <span class="blob blob-2"></span>
      <span class="blob blob-3"></span>
    </div>

    <div id="app" class="app-shell">
      <!-- Skeleton: виден до первой отрисовки, чтобы не было «прыжка» интерфейса -->
      <div class="boot" id="boot">
        <div class="boot-pug">🐶</div>
        <h1 class="boot-title">Мопсик вдвоём</h1>
        <p class="boot-sub">Загружаем будку…</p>
        <div class="boot-bar"><span></span></div>
      </div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="modal-root"></div>

    <noscript>
      <div style="padding: 24px; font-family: sans-serif">Для игры включите JavaScript 🐾</div>
    </noscript>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
